name: dealflow-auth

services:
  mongodb:
    # MongoDB 8 currently refuses to start on Docker's Linux 6.19 VM kernel.
    # MongoDB 7 is sufficient for this utility and keeps the local stack portable.
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - dealflow-mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks:
      - dealflow

  auth-api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/dealflow
      PUBLIC_APP_URL: http://localhost:9080
      ALLOWED_ORIGINS: http://localhost:9080,http://localhost:5174
      SESSION_PEPPER: ${SESSION_PEPPER:-local-only-change-this-session-pepper}
      ADMIN_NAME: ${ADMIN_NAME:-DealFlow Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dealflow.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@360}
      DEMO_PORTAL_TOKEN: ${DEMO_PORTAL_TOKEN:-DF360-ACME-2026-DEMO}
      DEMO_PORTAL_CUSTOMER_NAME: ${DEMO_PORTAL_CUSTOMER_NAME:-Acme Corporation}
      DEMO_PORTAL_CUSTOMER_EMAIL: ${DEMO_PORTAL_CUSTOMER_EMAIL:-procurement@acme.example}
      DEMO_PORTAL_QUOTATION_ID: ${DEMO_PORTAL_QUOTATION_ID:-quote_acme_demo}
      DEMO_PORTAL_QUOTATION_REFERENCE: ${DEMO_PORTAL_QUOTATION_REFERENCE:-Q-2026-0042}
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 4s
      retries: 20
    networks:
      - dealflow

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK_AUTH: "false"
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dealflow

  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.17.0-debian}
    restart: unless-stopped
    depends_on:
      auth-api:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./infrastructure/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infrastructure/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
    networks:
      - dealflow

networks:
  dealflow:

volumes:
  dealflow-mongodb:
