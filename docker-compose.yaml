services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - dealflow-mongodb:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks:
      - dealflow

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    env_file:
      - ./object_storage/.env
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-metadata:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    networks:
      - dealflow

  garage-ui:
    image: noooste/garage-ui:v0.12.1
    restart: unless-stopped
    depends_on:
      garage:
        condition: service_healthy
    env_file:
      - ./object_storage/.env
    ports:
      - "127.0.0.1:3909:8080"
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
    networks:
      - dealflow

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      otel-collector:
        condition: service_started
      morning_star:
        condition: service_healthy
      night_sky:
        condition: service_healthy
    env_file:
      - ./api-gateway/.env
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('node:net');const socket=net.connect(4000,'127.0.0.1');socket.setTimeout(3000);socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('error',()=>process.exit(1));socket.once('timeout',()=>{socket.destroy();process.exit(1)})",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
    networks:
      - dealflow
      - observability

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    environment:
      VITE_USE_MOCK_AUTH: "false"
      # The browser reaches this dev server through APISIX, so the hot-reload
      # socket has to be opened against the gateway rather than 5173.
      VITE_HMR_CLIENT_PORT: "9080"
      VITE_HMR_HOST: "localhost"
      VITE_HMR_PROTOCOL: "ws"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    expose:
      - "5173"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks:
      - dealflow

  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.17.0-debian}
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APISIX_STAND_ALONE: "true"
    volumes:
      - ./infrastructure/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infrastructure/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
    networks:
      - dealflow

  otel-collector:
    build:
      context: ./otel_collector
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - loki
      - tempo
    networks:
      - observability

  # emails:
  #   build:
  #     context: .
  #     dockerfile: emails/Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     otel-collector:
  #       condition: service_started
  #   env_file:
  #     - ./emails/.env
  #   networks:
  #     - observability

  night_sky:
    build:
      context: .
      dockerfile: night_sky/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      otel-collector:
        condition: service_started
    env_file:
      - ./night_sky/.env
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
    networks:
      - observability
      - dealflow

  morning_star:
    build:
      context: .
      dockerfile: morning_star/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      garage:
        condition: service_healthy
      otel-collector:
        condition: service_started
    env_file:
      - ./morning_star/.env
      - ./object_storage/.env
    expose:
      - "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 20
    networks:
      - observability
      - dealflow

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - observability

networks:
  dealflow:
  observability:

volumes:
  dealflow-mongodb:
  frontend-node-modules:
  redis-data:
  loki-data:
  grafana-data:
  tempo-data:
  garage-metadata:
  garage-data:
